AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM automation lab stack. Secrets Manager OTP for all users; S3 group lists
  buckets; EC2 group lists and creates instances; three console users with
  forced password change on first login.

Resources:
  OneTimePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: iam-lab/one-time-user-password
      Description: One-time password used for all IAM lab users.
      GenerateSecretString:
        SecretStringTemplate: '{"password":""}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludePunctuation: true
        RequireEachIncludedType: true

  S3UserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: iam-lab-s3-group
      ManagedPolicyArns:
        - !Ref S3ListBucketsPolicy
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  EC2UserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: iam-lab-ec2-group
      ManagedPolicyArns:
        - !Ref EC2LabPolicy
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  S3ListBucketsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: iam-lab-s3-list-buckets-policy
      Description: Allows listing S3 buckets only.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBucketsOnly
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'

  EC2LabPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: iam-lab-ec2-access-policy
      Description: EC2 lab group — list/describe instances (console) and create/manage instances.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DescribeEc2ForConsole
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeImages
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeKeyPairs
              - ec2:DescribeVpcs
              - ec2:DescribeInstanceTypes
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeAccountAttributes
            Resource: '*'
          - Sid: CreateAndManageInstances
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:CreateTags
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:StartInstances
            Resource: '*'

  Ec2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user1
      Groups:
        - !Ref EC2UserGroup
      LoginProfile:
        Password: !Sub "{{resolve:secretsmanager:${OneTimePasswordSecret}:SecretString:password}}"
        PasswordResetRequired: true
      Policies:
        - PolicyName: DenyRunInstancesForEc2User1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyLaunchEc2User1Only
                Effect: Deny
                Action:
                  - ec2:RunInstances
                Resource: '*'

  Ec2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user2
      Groups:
        - !Ref EC2UserGroup
      LoginProfile:
        Password: !Sub "{{resolve:secretsmanager:${OneTimePasswordSecret}:SecretString:password}}"
        PasswordResetRequired: true

  S3User:
    Type: AWS::IAM::User
    Properties:
      UserName: s3-user
      Groups:
        - !Ref S3UserGroup
      LoginProfile:
        Password: !Sub "{{resolve:secretsmanager:${OneTimePasswordSecret}:SecretString:password}}"
        PasswordResetRequired: true

Outputs:
  OneTimePasswordSecretArn:
    Description: ARN of the generated one-time password secret.
    Value: !Ref OneTimePasswordSecret

  S3GroupName:
    Description: IAM group for S3 bucket-list permissions.
    Value: !Ref S3UserGroup

  EC2GroupName:
    Description: IAM group whose managed policy allows EC2 list/describe and RunInstances (ec2-user1 has user-level Deny on RunInstances).
    Value: !Ref EC2UserGroup

  Ec2User1Name:
    Description: IAM user assigned to EC2 group.
    Value: !Ref Ec2User1

  Ec2User2Name:
    Description: IAM user assigned to EC2 group.
    Value: !Ref Ec2User2

  S3UserName:
    Description: IAM user assigned to S3 group.
    Value: !Ref S3User
